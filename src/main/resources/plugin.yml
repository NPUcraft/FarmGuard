name: FarmGuard
version: ${version}
main: dev.farmguard.FarmGuardPlugin
api-version: '1.21'
description: Automation facility monitoring, lag detection and protection for Paper
authors:
  - FarmGuard
website: https://github.com/farmguard/FarmGuard
folia-supported: false
commands:
  farmguard:
    description: FarmGuard 管理命令
    aliases: [fg]
    usage: /<command> <status|top|inspect|limits|mode|whitelist|reload>
permissions:
  farmguard.admin:
    description: FarmGuard 全部管理权限
    default: op
    children:
      farmguard.status: true
      farmguard.top: true
      farmguard.inspect: true
      farmguard.manage: true
      farmguard.reload: true
  farmguard.status:
    description: 查看服务器与 FarmGuard 状态
    default: op
  farmguard.top:
    description: 查看热点区块排行
    default: op
  farmguard.inspect:
    description: 检查指定区块或当前所在区块
    default: op
  farmguard.manage:
    description: 切换模式与管理白名单
    default: op
  farmguard.reload:
    description: 重载 FarmGuard 配置
    default: op
  farmguard.bypass:
    description: 仅豁免能关联到当前玩家的直接行为（例如亲自繁殖）。不能表示该玩家建造的自动机器永久豁免。
    default: false
