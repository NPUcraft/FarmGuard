_meta:
  locale: en_US
  name: English

prefix: "<gray>[<green>FarmGuard</green>]</gray> "

format:
  list-separator: ", "
  reason-more: "+{count}"
  per-window: "{count} / {seconds}s"
  per-second: "{rate}/s"
  estimated: "{count} (estimated)"
  chunk: "{world}  ({x},{z})"
  missing: "<missing:{key}>"

common:
  yes-text: "Yes"
  no-text: "No"
  on-text: "ON"
  off-text: "OFF"
  none: "None"

command:
  no-permission: "<red>You do not have permission to use this command.</red>"
  unknown: "<red>Unknown subcommand. Use /{label} help for a list of commands.</red>"
  invalid-number: "<red>That argument must be an integer.</red>"
  player-only: "<red>This subcommand must be used in-game.</red>"
  failed: "<red>The command failed. Check the console for details.</red>"
  help:
    header: "<gold>===== FarmGuard Commands =====</gold>"
    status: "/{label} status — server and FarmGuard status"
    top: "/{label} top [n] — hotspots worth a look"
    inspect: "/{label} inspect [x z | world x z] — what is happening in this chunk"
    limits: "/{label} limits — areas currently restricted"
    mode: "/{label} mode [monitor|protect] — view or change mode"
    whitelist: "/{label} whitelist <add|remove|list> — exemption list"
    reload: "/{label} reload — reload config and language files"
    language: "/{label} language [zh_CN|en_US] — view or change UI language"
  status:
    header: "<gold>===== FarmGuard Status =====</gold>"
    mode: "Mode: <white>{mode}</white>"
    tps: "TPS: <white>{tps}</white>  MSPT: <white>{mspt}</white>  Avg MSPT: <white>{avg-mspt}</white>"
    pressure: "Server pressure: <white>{pressure}</white>  Lag incident: <white>{lag}</white>"
    chunks: "Active chunks: <white>{active}</white>  High-risk chunks: <white>{high-risk}</white>"
    limits: "Restricting: <white>{limits}</white>  Tracked chunks: <white>{tracked}</white>"
    debug-on: "Debug log: <white>ON</white>"
    debug-off: "Debug log: <white>OFF</white>"
  top:
    title: "Hotspots TOP {limit}"
    metrics: "TPS {tps} | MSPT {mspt} | Status {pressure}"
    empty: "No chunks are active enough to list."
    no-high-risk: "No high-risk hotspots detected. Showing the most active facilities."
    attention-count: "{count} hotspots require attention."
    activity-label: "Activity"
    chunks-count: "{count} chunks"
    throttled: "THROTTLED"
    emergency: "EMERGENCY"
    hover-inspect: "Click to inspect"
  inspect:
    title: "Chunk Inspection"
    location: "{world} ({x},{z})"
    missing: "<yellow>This chunk has no recent tracked activity.</yellow>"
    console-usage: "<red>From console use /{label} inspect <world> <x> <z>.</red>"
    world-not-found: "<red>World <white>{world}</white> was not found.</red>"
    risk-level: "Risk Level"
    activity-score: "Activity Score"
    risk-score: "Risk Score"
    correlation: "Correlation"
    protection: "Protection"
    protection-none: "None"
    activity-title: "Primary Activity"
    reason-title: "Risk Factors"
    cluster-title: "Automation Cluster"
    cluster-type: "Facility Type"
    cluster-type-hover: "V1 classification is based on current activity and may change as the facility operates."
    cluster-id: "ID"
    cluster-chunks: "Chunks"
    whitelist: "Whitelist"
    no-cluster: "Not part of an automation cluster"
  limits:
    header: "<gold>===== Active Restrictions =====</gold>"
    empty: "No areas are currently restricted."
  mode:
    current: "Current mode: <white>{mode}</white>"
    changed: "Mode changed to <white>{mode}</white>"
    invalid: "<red>Invalid mode. Use MONITOR or PROTECT.</red>"
    monitor-hint: "Automatic restrictions are off. Monitoring and rankings still run."
    protect-hint: "FarmGuard may apply temporary throttles when server pressure is high enough."
  whitelist:
    added: "Added chunk <white>{world} {x},{z}</white> to the whitelist (still monitored, never auto-restricted)."
    removed: "Removed chunk <white>{world} {x},{z}</white> from the whitelist."
    exists: "<yellow>That chunk is already on the whitelist.</yellow>"
    missing: "<yellow>That chunk is not on the whitelist.</yellow>"
    empty: "The whitelist is empty."
    header: "Whitelist (no auto-restriction; still monitored / scored / ranked / recorded):"
    chunk: "Chunk {chunk}"
    cluster: "Cluster {id}"
  reload:
    success: "<green>FarmGuard configuration reloaded.</green>"
    partial: "<yellow>Configuration loaded, but {count} value(s) fell back to defaults. Check the console.</yellow>"
  language:
    current: "Current language: {name} ({locale})"
    available: "Available languages: {languages}"
    changed: "UI language is now {name} ({locale})"
    unknown: "<red>Unknown language: {locale}</red>"
    no-permission-change: "<red>You do not have permission to change the language.</red>"

mode:
  monitor: "Monitor"
  protect: "Protect"

risk:
  level:
    none: "None"
    low: "Low"
    medium: "Medium"
    high: "High"
    critical: "Critical"

correlation:
  none: "None"
  possible: "Possible"
  strong: "Strong"

protection:
  normal: "Normal"
  warning: "Warning"
  throttle: "Throttled"
  emergency: "Emergency"

pressure:
  normal: "Normal"
  warning: "Warning"
  high: "High"
  critical: "Critical"

activity:
  hopper: "Hopper"
  redstone: "Redstone"
  piston: "Piston"
  entity-spawn: "Mob spawns"
  entity-death: "Entity deaths"
  item: "Item drops"
  villager: "Villager"
  minecart: "Minecart"
  breeding: "Breeding"
  block-update: "Block activity"
  entity-density: "Entity density"
  item-density: "Item density"
  villager-density: "Villager density"
  minecart-density: "Minecart density"

risk-reason:
  excessive-redstone: "High redstone activity"
  excessive-redstone-detail: "Redstone fires in this area are above the reference rate."
  excessive-pistons: "High piston activity"
  excessive-pistons-detail: "Piston activity in this area is above the reference rate."
  excessive-hoppers: "High hopper activity"
  excessive-hoppers-detail: "Hopper transfers in this area are frequent. High activity is not the same as lag."
  excessive-entities: "High entity density"
  excessive-entities-detail: "Estimated entity density in this area is high."
  excessive-items: "High item activity"
  excessive-items-detail: "Item count or item spawn rate in this area is high."
  excessive-minecarts: "High minecart activity"
  excessive-minecarts-detail: "Minecart count or activity in this area is high."
  excessive-villagers: "High villager density"
  excessive-villagers-detail: "Villager density or activity in this area is high."
  excessive-spawns: "High spawn activity"
  excessive-spawns-detail: "Mobs are spawning faster than the reference rate."
  excessive-block-updates: "High block-update activity"
  excessive-block-updates-detail: "Block updates in this area are above the reference rate."
  rapid-oscillation: "Rapid oscillation"
  rapid-oscillation-detail: "Redstone is firing extremely often in the short window, like a fast clock."
  sudden-spike: "Sudden activity spike"
  sudden-spike-detail: "Short-window activity is much higher than the longer window."
  sustained-load: "Sustained activity"
  sustained-load-detail: "This area has remained highly active over the longer analysis window."
  lag-suspect: "Possible lag correlation"
  lag-suspect-detail: "Activity here may be rising in step with server MSPT."
  strong-lag-correlation: "Strong lag correlation"
  strong-lag-correlation-detail: "Activity here has been closely aligned with MSPT in the recent window."
  runaway-growth: "Rapid growth"
  runaway-growth-detail: "Item or entity counts are still climbing quickly."

cluster:
  farm: "Farm"
  redstone-machine: "Redstone Machine"
  storage: "Storage"
  villager-facility: "Villager Facility"
  mob-facility: "Mob Facility"
  unknown-automation: "Unknown Automation"

notify:
  server-lag: "<red>The server looks lagged: TPS {tps}, MSPT {mspt}, pressure {pressure}.</red>"
  high-risk: "<yellow>{world} ({x},{z}) has been {level} for {seconds}s. Main reasons: {reasons}.</yellow>"
  critical-risk: "<red>{world} ({x},{z}) has been Critical for {seconds}s. Main reasons: {reasons}. Correlation: {correlation}.</red>"
  lag-recovered: "<green>Server performance recovered: TPS {tps}, MSPT {mspt}.</green>"
  risk-suppressed: "<yellow>{count} additional high-risk chunk notice(s) were merged to avoid spam.</yellow>"
  protection-start: "<yellow>Temporary restriction started on {world} ({x},{z}): {level}. Reasons: {reasons}. Builds are not broken.</yellow>"
  protection-escalated: "<red>Restriction on {world} ({x},{z}) escalated to {level}. Reasons: {reasons}.</red>"
  protection-end: "<green>Temporary restriction on {world} ({x},{z}) has been released.</green>"
