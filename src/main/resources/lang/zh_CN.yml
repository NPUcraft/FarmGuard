_meta:
  locale: zh_CN
  name: 简体中文

prefix: "<gray>[<green>FarmGuard</green>]</gray> "

format:
  list-separator: "、"
  reason-more: "+{count}"
  per-window: "{count} / {seconds}秒"
  per-second: "{rate}/s"
  estimated: "{count}（估算）"
  chunk: "{world}  ({x},{z})"
  missing: "<missing:{key}>"

common:
  yes-text: "是"
  no-text: "否"
  on-text: "开启"
  off-text: "关闭"
  none: "无"

command:
  no-permission: "<red>你没有权限执行该命令。</red>"
  unknown: "<red>未知子命令。使用 /{label} help 查看帮助。</red>"
  invalid-number: "<red>参数必须是整数。</red>"
  player-only: "<red>该子命令需要在游戏内执行。</red>"
  failed: "<red>命令执行失败，请查看控制台。</red>"
  help:
    header: "<gold>===== FarmGuard 命令 =====</gold>"
    status: "/{label} status — 服务器与 FarmGuard 状态"
    top: "/{label} top [n] — 值得关注的热点区块"
    inspect: "/{label} inspect [x z | 世界 x z] — 查看该区块发生了什么"
    limits: "/{label} limits — 正在限制的区域"
    mode: "/{label} mode [monitor|protect] — 查看或切换模式"
    whitelist: "/{label} whitelist <add|remove|list> — 白名单"
    reload: "/{label} reload — 重载配置与语言文件"
    language: "/{label} language [zh_CN|en_US] — 查看或切换界面语言"
  status:
    header: "<gold>===== FarmGuard 状态 =====</gold>"
    mode: "模式: <white>{mode}</white>"
    tps: "TPS: <white>{tps}</white>  MSPT: <white>{mspt}</white>  平均MSPT: <white>{avg-mspt}</white>"
    pressure: "服务器压力: <white>{pressure}</white>  卡顿事件: <white>{lag}</white>"
    chunks: "活跃区块: <white>{active}</white>  高风险区块: <white>{high-risk}</white>"
    limits: "正在限制: <white>{limits}</white>  跟踪区块: <white>{tracked}</white>"
    debug-on: "诊断日志: <white>开启</white>"
    debug-off: "诊断日志: <white>关闭</white>"
  top:
    title: "热点 TOP {limit}"
    metrics: "TPS {tps} | MSPT {mspt} | 状态 {pressure}"
    empty: "当前没有足够活跃的区块。"
    no-high-risk: "当前没有高风险热点，以下为活动量最高的设施。"
    attention-count: "发现 {count} 个需要关注的热点。"
    activity-label: "活跃"
    chunks-count: "{count} 个区块"
    throttled: "正在限流"
    emergency: "紧急保护"
    hover-inspect: "点击查看详细诊断"
  inspect:
    title: "区块诊断"
    location: "{world} ({x},{z})"
    missing: "<yellow>该区块近期没有被跟踪的活动。</yellow>"
    console-usage: "<red>控制台请使用 /{label} inspect 世界名 x z。</red>"
    world-not-found: "<red>找不到世界 <white>{world}</white>。</red>"
    risk-level: "风险等级"
    activity-score: "活动评分"
    risk-score: "风险评分"
    correlation: "关联程度"
    protection: "保护状态"
    protection-none: "未限制"
    activity-title: "主要活动"
    reason-title: "风险因素"
    cluster-title: "设施集群"
    cluster-type: "当前分类"
    cluster-type-hover: "V1 分类基于当前活动特征，可能随设施运行状态变化。"
    cluster-id: "ID"
    cluster-chunks: "区块数"
    whitelist: "白名单"
    no-cluster: "未加入设施集群"
  limits:
    header: "<gold>===== 当前限制区域 =====</gold>"
    empty: "当前没有正在限制的区域。"
  mode:
    current: "当前模式：<white>{mode}</white>"
    changed: "模式已切换为 <white>{mode}</white>"
    invalid: "<red>无效模式。可用：MONITOR、PROTECT。</red>"
    monitor-hint: "已关闭自动限制。监控与排行仍然工作。"
    protect-hint: "已允许在服务器压力足够时对高风险区域做临时限流。"
  whitelist:
    added: "已将区块 <white>{world} {x},{z}</white> 加入白名单（仍监控，但不会自动限制）。"
    removed: "已将区块 <white>{world} {x},{z}</white> 移出白名单。"
    exists: "<yellow>该区块已在白名单中。</yellow>"
    missing: "<yellow>该区块不在白名单中。</yellow>"
    empty: "当前没有区块或集群白名单。"
    header: "白名单（免自动限制，仍监控 / 评分 / 排行 / 记录）："
    chunk: "区块 {chunk}"
    cluster: "集群 {id}"
  reload:
    success: "<green>已重新加载 FarmGuard 配置。</green>"
    partial: "<yellow>配置已加载，但有 {count} 项使用了默认值。请查看控制台。</yellow>"
  language:
    current: "当前语言：{name} ({locale})"
    available: "可用语言：{languages}"
    changed: "界面语言已切换为 {name} ({locale})"
    unknown: "<red>未知语言：{locale}</red>"
    no-permission-change: "<red>你没有权限切换语言。</red>"

