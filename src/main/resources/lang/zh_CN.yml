  risk-suppressed: "<yellow>还有 {count} 个高风险区块通知被合并，避免刷屏。</yellow>"
  protection-start: "<yellow>已对 {world} ({x},{z}) 启动临时限制：{level}。原因：{reasons}。不会破坏建筑。</yellow>"
  protection-escalated: "<red>已将 {world} ({x},{z}) 限制升级为 {level}。原因：{reasons}。</red>"
  protection-end: "<green>{world} ({x},{z}) 的临时限制已解除。</green>"
