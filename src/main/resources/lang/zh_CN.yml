notify:
  server-lag: "<red>服务器疑似进入卡顿：TPS {tps}，MSPT {mspt}，压力 {pressure}。</red>"
  high-risk: "<yellow>{world} ({x},{z}) 已持续 {seconds} 秒处于 {level}。主要原因：{reasons}。</yellow>"
