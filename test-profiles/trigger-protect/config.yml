# TEST-ONLY PROFILE. NEVER use on a survival / production server.
# 仅用于证明保护链可以启动：Hopper THROTTLE + 物品守恒 + /fg mode monitor 立即释放。
# 阈值被故意降低。测试结束后必须恢复 MONITOR 默认配置。

mode: PROTECT

server-pressure:
  warning-mspt: 35.0
  high-mspt: 48.0
  critical-mspt: 65.0
  warning-tps: 18.0
  high-tps: 15.5
  critical-tps: 12.0
  warning-exit-mspt: 28.0
  high-exit-mspt: 40.0
  critical-exit-mspt: 52.0
  warning-exit-tps: 19.0
  high-exit-tps: 17.0
  critical-exit-tps: 14.5
  enter-min-duration-seconds: 1
  exit-stability-seconds: 4
  cooldown-seconds: 1
  mspt-average-samples: 12

activity-thresholds:
  hopper-per-second: 4.0
  redstone-per-second: 80.0
  piston-per-second: 16.0

risk:
  low-score: 8.0
  medium-score: 16.0
  high-score: 24.0
  critical-score: 78.0
  hotspot-min-activity-score: 4.0

protection:
  enter-min-duration-seconds: 1
  exit-stability-seconds: 4
  cooldown-seconds: 1
  throttle-rates:
    hopper: 1
    spawn: 2
    breeding: 1
    piston: 4
    redstone: 20
    item: 10
    minecart: 2
  emergency-rates:
    hopper: 0
    spawn: 0
    breeding: 0
    piston: 1
    redstone: 4
    item: 2
    minecart: 0
  throttle-min-pressure: NORMAL
  emergency-min-pressure: CRITICAL
  throttle-min-risk: LOW
  emergency-min-risk: CRITICAL
  require-lag-correlation-for-emergency: true
  emergency-only-throttles:
    - REDSTONE
    - PISTON
    - ITEM
    - MINECART
  spawn-throttle-reasons:
    - SPAWNER
    - TRIAL_SPAWNER
    - SLIME_SPLIT
  enabled-throttles:
    hopper: true
    spawn: true
    breeding: true
    piston: true
    redstone: true
    item: false
    minecart: true

notifications:
  console: true
  notify-admins: true
  cooldown-seconds: 10
  persist-seconds: 30
  max-per-cycle: 3
  admin-permission: farmguard.status

debug-log:
  enabled: false
  snapshot-interval-seconds: 10
  hotspot-top-n: 10
  max-file-size-mb: 32
  max-files: 5

debug: false
