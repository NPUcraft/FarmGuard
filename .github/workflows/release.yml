name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and package plugin JAR
        run: ./gradlew --no-daemon clean test jar

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          JAR="build/libs/FarmGuard-${VERSION}.jar"
          NOTES="RELEASE-NOTES-${VERSION}.md"
          if [ ! -f "$JAR" ]; then
            echo "Missing JAR for ${VERSION}" >&2
            ls -la build/libs || true
            exit 1
          fi
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes ${NOTES}" >&2
            exit 1
          fi
          SHA_FILE="build/libs/FarmGuard-${VERSION}.sha256"
          sha256sum "$JAR" | awk '{print toupper($1)}' > "$SHA_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$SHA_FILE" --clobber
          else
            gh release create "$TAG" \
              --title "FarmGuard ${VERSION}" \
              --notes-file "$NOTES" \
              --prerelease \
              --verify-tag \
              "$JAR" \
              "$SHA_FILE"
          fi
